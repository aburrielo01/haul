services:
  - type: web
    name: haul
    runtime: docker
    plan: starter          # el disco persistente necesita plan de pago; con free usa Postgres
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # Si prefieres Postgres en vez de SQLite, descomenta y crea la base de datos:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: haul-db
      #     property: connectionString
    disk:
      name: haul-data
      mountPath: /data
      sizeGB: 1

