services:
  - type: web
    name: haul
    runtime: docker
    plan: starter          # el disco persistente necesita plan de pago; con free usa Postgres
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # Vigilancia de precios (v4): cada 12 h, solo intentos gratuitos. WATCH=off la apaga.
      - key: WATCH_EVERY_H
        value: "12"
      # Avisos push (v4): genera el par con `npx web-push generate-vapid-keys`
      # y ponlo en el panel de Render; sin claves la app funciona sin avisos.
      # - key: VAPID_PUBLIC_KEY
      #   sync: false
      # - key: VAPID_PRIVATE_KEY
      #   sync: false
      # - key: VAPID_SUBJECT
      #   value: mailto:tu@correo
      # Si prefieres Postgres en vez de SQLite, descomenta y crea la base de datos:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: haul-db
      #     property: connectionString
    disk:
      name: haul-data
      mountPath: /data
      sizeGB: 1

